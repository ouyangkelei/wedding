<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>婚礼邀请函</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root {
  --red-deep: #8B1A1A;
  --red-main: #A02020;
  --red-light: #B23A3A;
  --cream: #F5E6D3;
  --cream-light: #FAF0E6;
  --cream-dark: #E8D5BE;
  --gold: #C9A96E;
  --text-dark: #3D2B1F;
  --text-brown: #6B4F3A;
  --text-light: #F5E6D3;
  --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--cream-light);
  color: var(--text-dark);
  line-height: 1.8;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.page-wrap {
  max-width: 480px;
  margin: 0 auto;
  background: var(--cream-light);
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,0.08);
}

.section { width: 100%; position: relative; overflow: hidden; }
.section-cream { background: var(--cream-light); }
.section-red { background: var(--red-deep); color: var(--text-light); }

.rings-icon { width: 80px; height: 50px; margin: 0 auto; display: block; }
.rings-icon svg { width: 100%; height: 100%; }

.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* ========== 封面 ========== */
.cover {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 60px 30px 0;
  position: relative;
}
.cover::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(139,26,26,0.95) 0%, rgba(139,26,26,0.85) 100%);
  z-index: 1;
}
.cover-bg {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover; background-position: center;
  z-index: 0; filter: brightness(0.7);
}
.cover-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; }
.cover-xi {
  font-family: var(--serif); font-size: 72px; font-weight: 900;
  color: var(--cream); letter-spacing: 8px; margin-bottom: 16px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.cover-subtitle {
  font-family: var(--serif); font-size: 20px; color: var(--cream);
  letter-spacing: 6px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px;
}
.cover-subtitle .heart { color: #E85D5D; font-size: 16px; }
.cover-rings { margin-bottom: 28px; }
.cover-names {
  font-family: var(--serif); font-size: 26px; color: var(--cream);
  letter-spacing: 4px; margin-bottom: 40px;
}
.cover-names .dot { margin: 0 16px; color: var(--gold); }
.cover-photo {
  width: 100%; max-width: 340px; aspect-ratio: 3/4; border-radius: 8px;
  overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  border: 3px solid rgba(201,169,110,0.4);
}
.cover-photo img { width: 100%; height: 100%; object-fit: cover; }
.cover-scroll-hint {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  z-index: 2; color: var(--cream); font-size: 12px; letter-spacing: 3px;
  opacity: 0.7; animation: bounce 2s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ========== 邀请函标题 ========== */
.invite-title { padding: 0 0 50px; }
.invite-detail-img { width: 100%; height: 180px; overflow: hidden; }
.invite-detail-img img { width: 100%; height: 100%; object-fit: cover; }
.invite-title-text { text-align: center; padding: 40px 30px 30px; }
.invite-title-main {
  font-family: var(--serif); font-size: 32px; font-weight: 700;
  color: var(--text-dark); letter-spacing: 8px; margin-bottom: 8px;
}
.invite-title-en {
  font-family: var(--serif); font-size: 16px; color: var(--red-main);
  letter-spacing: 4px; font-style: italic; margin-bottom: 30px;
}
.arch-photo { width: 280px; margin: 0 auto 30px; position: relative; }
.arch-photo::before {
  content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
  border: 2px solid var(--red-main); border-radius: 140px 140px 8px 8px; opacity: 0.3;
}
.arch-photo-inner {
  width: 100%; aspect-ratio: 3/4; border-radius: 140px 140px 8px 8px;
  overflow: hidden; border: 3px solid var(--red-main);
}
.arch-photo-inner img { width: 100%; height: 100%; object-fit: cover; }
.invite-poem {
  text-align: center; font-family: var(--serif); color: var(--text-brown);
  font-size: 15px; line-height: 2.2; letter-spacing: 2px;
}

/* ========== 新人介绍 ========== */
.intro-section { padding: 50px 30px; }
.poem-block { text-align: center; margin-bottom: 36px; }
.poem-block p {
  font-family: var(--serif); font-size: 15px; color: var(--text-brown);
  line-height: 2.2; letter-spacing: 1px; margin-bottom: 4px;
}
.poem-block .poem-title { font-size: 17px; color: var(--text-dark); font-weight: 600; margin-bottom: 6px; }
.couple-photos { display: flex; gap: 16px; margin-bottom: 20px; }
.couple-photo-item { flex: 1; text-align: center; }
.couple-photo-frame {
  width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
  margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}
.couple-photo-frame img { width: 100%; height: 100%; object-fit: cover; }
.couple-label {
  font-family: var(--serif); font-size: 14px; color: var(--red-main);
  letter-spacing: 3px; margin-bottom: 4px; display: flex; align-items: center;
  justify-content: center; gap: 6px;
}
.couple-label .heart-mini { color: #E85D5D; font-size: 10px; }
.couple-name {
  font-family: var(--serif); font-size: 22px; color: var(--text-dark);
  letter-spacing: 3px; font-weight: 600;
}

/* ========== 婚礼信息 ========== */
.wedding-info { padding: 30px 30px 50px; }
.info-block { text-align: center; margin-bottom: 36px; }
.info-label {
  font-family: var(--serif); font-size: 13px; color: var(--red-main);
  letter-spacing: 4px; margin-bottom: 8px;
}
.info-title {
  font-family: var(--serif); font-size: 22px; color: var(--text-dark);
  font-weight: 700; letter-spacing: 4px; margin-bottom: 14px;
}
.info-detail {
  font-family: var(--sans); font-size: 16px; color: var(--text-brown);
  line-height: 2; letter-spacing: 1px;
}
.info-detail .date-main { font-size: 18px; font-weight: 500; color: var(--text-dark); }
.banner-photo {
  width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden;
  margin-top: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}
.banner-photo img { width: 100%; height: 100%; object-fit: cover; }

/* ========== 誓言页 ========== */
.oath-section { padding: 0 0 50px; }
.oath-top-photo { width: 100%; height: 280px; overflow: hidden; }
.oath-top-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
.oath-content { padding: 40px 30px 0; text-align: center; }
.oath-rings { margin-bottom: 20px; }
.oath-title {
  font-family: var(--serif); font-size: 26px; color: var(--red-main);
  letter-spacing: 6px; margin-bottom: 24px; font-weight: 700;
}
.oath-text {
  font-family: var(--serif); font-size: 15px; color: var(--text-brown);
  line-height: 2.4; letter-spacing: 1px; margin-bottom: 30px;
}
.oath-photo {
  width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.1);
}
.oath-photo img { width: 100%; height: 100%; object-fit: cover; }

/* ========== 照片展示 ========== */
.gallery-section { padding: 20px 30px 50px; }
.gallery-large {
  width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden;
  margin-bottom: 16px; box-shadow: 0 10px 28px rgba(0,0,0,0.1);
}
.gallery-large img { width: 100%; height: 100%; object-fit: cover; }
.gallery-row { display: flex; gap: 16px; }
.gallery-small {
  flex: 1; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}
.gallery-small img { width: 100%; height: 100%; object-fit: cover; }

/* ========== 誓言2 ========== */
.oath2-section { padding: 0 0 50px; }
.oath2-detail { display: flex; gap: 12px; padding: 0 30px; margin-bottom: 30px; }
.oath2-detail-item {
  flex: 1; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}
.oath2-detail-item img { width: 100%; height: 100%; object-fit: cover; }
.oath2-content { padding: 10px 30px 0; text-align: center; }
.oath2-closeup {
  width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
  margin-top: 30px; box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}
.oath2-closeup img { width: 100%; height: 100%; object-fit: cover; }

/* ========== 照片展示2 ========== */
.gallery2-section { padding: 20px 30px 50px; }
.gallery2-wide {
  width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
  margin-bottom: 16px; box-shadow: 0 10px 28px rgba(0,0,0,0.1);
}
.gallery2-wide img { width: 100%; height: 100%; object-fit: cover; }
.gallery2-card {
  width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden;
  box-shadow: 0 10px 28px rgba(0,0,0,0.1); background: var(--cream); padding: 16px;
}
.gallery2-card-inner { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; }
.gallery2-card-inner img { width: 100%; height: 100%; object-fit: cover; }

/* ========== 日历 ========== */
.calendar-section { padding: 0 30px 50px; }
.calendar-top-photo {
  width: calc(100% + 60px); height: 200px; overflow: hidden;
  margin: 0 -30px 30px;
}
.calendar-top-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
.calendar-header { text-align: center; margin-bottom: 24px; }
.calendar-month {
  font-family: var(--serif); font-size: 48px; font-weight: 900;
  color: var(--red-main); line-height: 1;
}
.calendar-month .month-small { font-size: 24px; font-weight: 400; color: var(--text-brown); }
.calendar-year {
  font-family: var(--serif); font-size: 20px; color: var(--text-brown);
  letter-spacing: 4px; margin-top: 8px;
}
.calendar-grid { width: 100%; margin-bottom: 30px; }
.calendar-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
  margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--cream-dark);
}
.calendar-weekdays span {
  font-family: var(--serif); font-size: 14px; color: var(--text-brown); font-weight: 600;
}
.calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calendar-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-family: var(--sans); font-size: 15px; color: var(--text-brown); position: relative;
}
.calendar-day.empty { visibility: hidden; }
.calendar-day.wedding { color: white; font-weight: 700; }
.calendar-day.wedding::before {
  content: ''; position: absolute; width: 34px; height: 34px;
  background: var(--red-main); border-radius: 50%; z-index: 0;
  box-shadow: 0 2px 8px rgba(160,32,32,0.3);
}
.calendar-day span { position: relative; z-index: 1; }
.calendar-bottom-photo {
  width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}
.calendar-bottom-photo img { width: 100%; height: 100%; object-fit: cover; }

/* ========== 回执 ========== */
.rsvp-section { padding: 50px 30px 60px; text-align: center; }
.rsvp-welcome {
  font-family: var(--serif); font-size: 24px; color: var(--text-dark);
  letter-spacing: 6px; margin-bottom: 36px; font-weight: 600;
}
.rsvp-form { max-width: 320px; margin: 0 auto 40px; }
.form-group { margin-bottom: 20px; }
.form-input {
  width: 100%; padding: 14px 20px; border: 1.5px solid var(--red-main);
  border-radius: 30px; background: transparent; font-family: var(--sans);
  font-size: 15px; color: var(--text-dark); outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.form-input::placeholder { color: var(--text-brown); opacity: 0.6; }
.form-input:focus { border-color: var(--red-deep); box-shadow: 0 0 0 3px rgba(160,32,32,0.1); }
.form-submit {
  width: 100%; padding: 15px; background: var(--red-main); color: var(--cream);
  border: none; border-radius: 30px; font-family: var(--serif); font-size: 17px;
  letter-spacing: 6px; cursor: pointer; transition: background 0.3s, transform 0.2s; margin-top: 8px;
}
.form-submit:hover { background: var(--red-deep); }
.form-submit:active { transform: scale(0.98); }
.rsvp-thanks {
  display: none; font-family: var(--serif); font-size: 18px; color: var(--red-main);
  letter-spacing: 3px; padding: 30px 0;
}
.rsvp-thanks.show { display: block; }
.blessing {
  font-family: var(--serif); font-size: 14px; color: var(--text-brown);
  letter-spacing: 2px; line-height: 2; margin-top: 30px;
}
.blessing-heart { width: 50px; height: 45px; margin: 0 auto 16px; }
.blessing-heart svg { width: 100%; height: 100%; }

/* ========== 右上角按钮 ========== */
.top-btn {
  position: fixed; top: 20px; width: 40px; height: 40px; border-radius: 50%;
  background: rgba(139,26,26,0.8); border: 1px solid rgba(201,169,110,0.5);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  z-index: 100; backdrop-filter: blur(4px); transition: background 0.3s;
}
.top-btn:hover { background: rgba(139,26,26,1); }
.top-btn svg { width: 18px; height: 18px; fill: var(--cream); }
.music-btn { right: 20px; }
.music-btn.playing svg { animation: spin 4s linear infinite; }
.edit-btn { right: 70px; }
.edit-btn.active { background: var(--gold); }
.scroll-btn { right: 120px; }
.scroll-btn.active { background: var(--gold); }
.scroll-btn.active svg { animation: bounce 1.5s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ========== 编辑模式 ========== */
body.edit-mode .editable-text {
  outline: 2px dashed var(--red-main);
  outline-offset: 3px;
  cursor: text;
  background: rgba(160,32,32,0.05);
  border-radius: 4px;
  padding: 2px 4px;
}
body.edit-mode .editable-text:hover {
  background: rgba(160,32,32,0.12);
}
body.edit-mode .editable-img {
  position: relative;
  cursor: pointer;
  outline: 2px dashed var(--red-main);
  outline-offset: 2px;
}
body.edit-mode .editable-img::after {
  content: '点击更换图片';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(139,26,26,0.85);
  color: var(--cream);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-family: var(--sans);
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}
body.edit-mode .editable-img:hover::after {
  background: rgba(139,26,26,1);
}

/* 编辑工具栏 */
.edit-toolbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid #eee;
  padding: 12px 20px;
  display: none;
  justify-content: center;
  gap: 12px;
  z-index: 200;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
}
body.edit-mode .edit-toolbar { display: flex; }
body.edit-mode { padding-bottom: 70px; }
.edit-toolbar button {
  padding: 10px 24px;
  border-radius: 25px;
  border: none;
  font-family: var(--sans);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-save { background: var(--red-main); color: white; }
.btn-save:hover { background: var(--red-deep); }
.btn-reset { background: #f0f0f0; color: #666; }
.btn-reset:hover { background: #e0e0e0; }
.btn-exit { background: var(--gold); color: white; }
.btn-exit:hover { background: #b8965a; }
.btn-music { background: #e8d5b5; color: var(--red-deep); }
.btn-music:hover { background: #dcc59e; }

/* 保存提示 */
.save-toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 16px 32px;
  border-radius: 8px;
  font-size: 15px;
  z-index: 300;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.save-toast.show { opacity: 1; }

/* 隐藏的文件输入 */
#fileInput { display: none; }

@media (max-width: 380px) {
  .cover-xi { font-size: 60px; }
  .cover-names { font-size: 22px; }
  .invite-title-main { font-size: 28px; }
  .arch-photo { width: 240px; }
}
</style>
</head>
<body>

<div class="page-wrap" id="app"></div>

<!-- 音乐按钮 -->
<div class="top-btn music-btn" id="musicBtn" onclick="toggleMusic()">
  <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
</div>

<!-- 编辑按钮 -->
<div class="top-btn edit-btn" id="editBtn" onclick="toggleEditMode()" title="编辑内容">
  <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
</div>

<!-- 自动滚动按钮 -->
<div class="top-btn scroll-btn" id="scrollBtn" onclick="toggleAutoScroll()" title="自动滚动">
  <svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z M12 16l6-6-1.41-1.41L12 13.17l-4.59-4.58L6 10z"/></svg>
</div>

<!-- 编辑工具栏 -->
<div class="edit-toolbar">
  <button class="btn-music" onclick="pickMusic()">更换音乐</button>
  <button class="btn-reset" onclick="resetAll()">恢复默认</button>
  <button class="btn-save" onclick="saveChanges()">保存修改</button>
  <button class="btn-exit" onclick="toggleEditMode()">完成</button>
</div>

<!-- 保存提示 -->
<div class="save-toast" id="saveToast">已保存</div>

<!-- 隐藏文件输入 -->
<input type="file" id="fileInput" accept="image/*">
<input type="file" id="musicInput" accept="audio/*">

<audio id="bgMusic" loop>
  <source src="" type="audio/mpeg">
</audio>

/* ========== 本地存储 ========== */
function loadConfig() {
  try {

    if (saved) {
      return JSON.parse(saved);
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}

function saveConfig() {
  try {
    localStorage.setItem('wedding_invitation_config', JSON.stringify(CONFIG));
    showToast('已保存');
  } catch(e) {
    showToast('保存失败');
  }
}

function showToast(msg) {
  const toast = document.getElementById('saveToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

/* ========== 日历生成 ========== */
function generateCalendar(year, month, weddingDay) {
  const firstDay = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '<div class="calendar-weekdays">';
  weekdays.forEach(d => html += `<span>${d}</span>`);
  html += '</div><div class="calendar-days">';
  for (let i = 0; i < firstDay; i++) html += '<div class="calendar-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isWedding = d === weddingDay;
    html += `<div class="calendar-day ${isWedding ? 'wedding' : ''}"><span>${d}</span></div>`;
  }
  html += '</div>';
  return html;
}

/* ========== 入场动画 ========== */
function initFadeIn() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
}

/* ========== 编辑模式 ========== */
function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editBtn').classList.toggle('active', editMode);
  if (editMode) {
    bindEditEvents();
    showToast('编辑模式：点击文字修改，点击图片更换');
  }
}

function bindEditEvents() {
  document.querySelectorAll('.editable-text').forEach(el => {
    el.contentEditable = 'true';
    el.addEventListener('blur', onTextEdit);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });
}

function onTextEdit(e) {
  const key = e.target.dataset.text;
  const value = e.target.textContent.trim();
  if (!key) return;
  setConfigValue(key, value);
}

function setConfigValue(path, value) {
  const keys = path.split('.');
  let obj = CONFIG;
  for (let i = 0; i < keys.length - 1; i++) {
    if (obj[keys[i]] === undefined) obj[keys[i]] = {};
    obj = obj[keys[i]];
  }
  // 数字类型转换
  if (['weddingYear','weddingMonth','weddingDay'].includes(keys[keys.length-1])) {
    value = parseInt(value) || value;
  }
  obj[keys[keys.length-1]] = value;
  // 日期变化时重新渲染日历
  if (keys.includes('weddingYear') || keys.includes('weddingMonth') || keys.includes('weddingDay')) {
    const scrollPos = window.scrollY;
    render();
    window.scrollTo(0, scrollPos);
  }
}

/* ========== 图片更换 ========== */
function pickImage(key) {
  if (!editMode) return;
  currentImgKey = key;
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file || !currentImgKey) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const base64 = ev.target.result;
    CONFIG.photos[currentImgKey] = base64;
    const scrollPos = window.scrollY;
    render();
    window.scrollTo(0, scrollPos);
    showToast('图片已更换，记得点保存');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

/* ========== 音乐更换 ========== */
function pickMusic() {
  document.getElementById('musicInput').click();
}

document.getElementById('musicInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const base64 = ev.target.result;
    CONFIG.musicUrl = base64;
    const audio = document.getElementById('bgMusic');
    audio.src = base64;
    audio.load();
    showToast('音乐已更换，记得点保存');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

/* ========== 保存/重置 ========== */
function saveChanges() {
  // 收集所有文字修改
  document.querySelectorAll('.editable-text').forEach(el => {
    const key = el.dataset.text;
    if (key) setConfigValue(key, el.textContent.trim());
  });
  saveConfig();
}

function resetAll() {
  if (confirm('确定要恢复默认内容吗？所有修改将丢失。')) {
    localStorage.removeItem('wedding_invitation_config');

    render();
    showToast('已恢复默认');

  const name = document.getElementById('guestName').value;

    document.getElementById('rsvpForm').style.display = 'none';
    document.getElementById('rsvpThanks').classList.add('show');

/* ========== 音乐 ========== */
let musicPlaying = false;
function toggleMusic() {
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');
  if (!audio.src) {
    showToast('请在编辑模式中设置背景音乐');
    return;
  }
  if (musicPlaying) {
    audio.pause();
    btn.classList.remove('playing');
  } else {
    audio.play().catch(() => {});
    btn.classList.add('playing');
  }
  musicPlaying = !musicPlaying;
}

/* ========== 自动滚动 ========== */
let autoScrolling = false;
let scrollTimer = null;
let userScrolling = false;
let userScrollTimer = null;

function toggleAutoScroll() {
  const btn = document.getElementById('scrollBtn');
  if (autoScrolling) {
    stopAutoScroll();
    btn.classList.remove('active');
    showToast('已关闭自动滚动');
  } else {
    startAutoScroll();
    btn.classList.add('active');
    showToast('已开启自动滚动');
  }
}

function startAutoScroll() {
  autoScrolling = true;
  let lastTime = performance.now();
  
  function scrollStep(currentTime) {
    if (!autoScrolling) return;
    
    const deltaTime = currentTime - lastTime;
    lastTime = currentTime;
    
    if (!userScrolling && !editMode) {
      // 每秒滚动20000像素，极致流畅
      const scrollAmount = (20000 * deltaTime) / 1000;
      window.scrollBy(0, scrollAmount);
      
      // 滚动到底部后回到顶部
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 10) {
        setTimeout(() => {
          if (autoScrolling) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lastTime = performance.now();
          }
        }, 1500);
      }
    }
    
    requestAnimationFrame(scrollStep);
  }
  
  requestAnimationFrame(scrollStep);
}

function stopAutoScroll() {
  autoScrolling = false;
}

// 监听用户手动滚动
window.addEventListener('scroll', () => {
  if (!autoScrolling) return;
  userScrolling = true;
  if (userScrollTimer) clearTimeout(userScrollTimer);
  userScrollTimer = setTimeout(() => {
    userScrolling = false;
  }, 1500);
});

/* 启动 */
render();

// 页面加载后自动开启滚动
setTimeout(() => {
  startAutoScroll();
  document.getElementById('scrollBtn').classList.add('active');
}, 500);

// 音乐自动播放 - 多次尝试，确保能播放
let musicPlayed = false;
function tryPlayMusic() {
  if (musicPlayed) return;
  const audio = document.getElementById('bgMusic');
  if (audio && audio.src) {
    audio.play().then(() => {
      musicPlayed = true;
      musicPlaying = true;
      document.getElementById('musicBtn').classList.add('playing');
    }).catch(() => {
      // 被浏览器阻止，等用户交互
    });
  }
}

// 立即尝试播放
tryPlayMusic();
// 500ms后再试一次
setTimeout(tryPlayMusic, 500);
// 1秒后再试一次
setTimeout(tryPlayMusic, 1000);

// 任何用户交互都尝试播放
['click', 'touchstart', 'touchend', 'keydown', 'scroll', 'wheel', 'mousemove'].forEach(event => {
  document.addEventListener(event, tryPlayMusic, { once: false });
});
</script>
